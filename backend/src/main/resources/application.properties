spring.application.name=pharmacy-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
# PORT est fourni automatiquement par les hébergeurs (Render, Railway...)
server.port=${PORT:${SERVER_PORT:8081}}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT (secret Base64, minimum 256 bits pour HS256)
pharmasync.jwt.secret=${JWT_SECRET:UGhhcm1hU3luY1NlY3JldEtleUZvckpXVEF1dGhzMjU2Qml0cyE=}
pharmasync.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
spring.mvc.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# Adresse(s) du frontend autorisée(s) à appeler l'API (séparées par des virgules)
pharmasync.frontend-url=${FRONTEND_URL:http://localhost:4200}
