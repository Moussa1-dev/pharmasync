# Profil production (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pharmacy_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.h2.console.enabled=false

spring.sql.init.data-locations=classpath:data.sql

# Base PostgreSQL permanente : data.sql ne doit être chargé qu'UNE fois,
# sinon les pharmacies et les stocks de démonstration sont dupliqués à
# chaque redémarrage. Premier lancement : SQL_INIT_MODE=always, puis never.
spring.sql.init.mode=${SQL_INIT_MODE:never}
