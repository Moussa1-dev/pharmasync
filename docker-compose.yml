services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmasync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pharmasync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmacy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pharmasync_pgdata:
