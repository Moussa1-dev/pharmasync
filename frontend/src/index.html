<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>PharmaSync — Gestion Pharmaceutique</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plateforme de recherche de médicaments et gestion de pharmacies à N'Djamena">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>
  
  <!-- FontAwesome for Professional Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap">
  
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d9488">
</head>
<body>
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0f1c2e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .capsule-loader {
      width: 50px;
      height: 110px;
      position: relative;
      animation: rotateCapsule 2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    .capsule-top {
      position: absolute;
      top: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(135deg, #2dd4bf, #0f766e);
      border-radius: 30px 30px 0 0;
    }
    .capsule-bottom {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50%;
      background: #f1f5f9;
      border-radius: 0 0 30px 30px;
      box-shadow: inset 0 10px 15px rgba(0,0,0,0.1);
    }
    .capsule-band {
      position: absolute;
      top: 50%;
      width: 100%;
      height: 4px;
      background: rgba(0,0,0,0.15);
      transform: translateY(-50%);
      z-index: 2;
    }
    @keyframes rotateCapsule {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .loader-text {
      margin-top: 2.5rem;
      color: #fff;
      font-family: sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseText 1.5s infinite alternate;
    }
    @keyframes pulseText {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
  <script>
    if (typeof global === 'undefined') {
      var global = window;
    }
  </script>
  <div id="app-loader">
    <div class="capsule-loader">
      <div class="capsule-top"></div>
      <div class="capsule-band"></div>
      <div class="capsule-bottom"></div>
    </div>
    <div class="loader-text">PHARMASYNC</div>
  </div>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
