<section class="notifications-page animate-fade-in">
  <div class="page-header glass-panel">
    <div>
      <p class="eyebrow">Centre de notifications</p>
      <h2>Notifications<span *ngIf="auth.isPharmacistOrAdmin()"> - {{ auth.getActivePharmacyName() }}</span></h2>
    </div>

    <button type="button" class="btn btn-primary" (click)="markAllRead()" *ngIf="unreadCount > 0">
      <i class="fa-solid fa-check-double"></i>
      Tout marquer comme lu
    </button>
  </div>

  <div class="stats-grid" *ngIf="notifications.length > 0 || unreadCount > 0">
    <div class="stat-card glass-panel">
      <div class="stat-header">
        <span class="stat-icon">🔔</span>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-value">{{ notifications.length }}</div>
    </div>

    <div class="stat-card glass-panel warning">
      <div class="stat-header">
        <span class="stat-icon">📩</span>
        <div class="stat-label">Non lues</div>
      </div>
      <div class="stat-value">{{ unreadCount }}</div>
    </div>
  </div>

  <div class="notifications-list glass-panel" *ngIf="notifications.length; else emptyState">
    <button
      type="button"
      class="notification-item"
      *ngFor="let notification of notifications; trackBy: trackByNotification"
      [class.unread]="!notification.readFlag"
      (click)="openNotification(notification)"
    >
      <div class="notification-topline">
        <span class="notification-type">{{ notification.type }}</span>
        <span class="notification-time">{{ notification.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
      </div>

      <strong class="notification-title">{{ notification.title }}</strong>
      <p class="notification-message">{{ notification.message }}</p>

      <div class="notification-footer" *ngIf="notification.link">
        <span>Ouvrir</span>
        <i class="fa-solid fa-arrow-right"></i>
      </div>
    </button>
  </div>

  <ng-template #emptyState>
    <div class="empty-state glass-panel">
      <div class="empty-icon"><i class="fa-solid fa-bell-slash"></i></div>
      <h3>Aucune notification</h3>
      <p>Vous n’avez pas encore reçu de message pour cette pharmacie.</p>
      <a routerLink="/dashboard" class="btn btn-secondary">Retour au tableau de bord</a>
    </div>
  </ng-template>
</section>
